name: Release Extension

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0, v2.1.0, etc.

permissions:
  contents: write

jobs:
  release:
    name: Build & Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter & Formatter Verification
        run: |
          npm run lint
          npx prettier --check "src/**/*.{ts,css}" "popup.html"

      - name: Run Build and Package
        run: npm run pack

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          prerelease: false
          files: |
            blurry-gchat-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
